<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — AI Budget Prediction System</title>
  <meta name="description" content="Login to the AI-Based Financial Budget Deviation Prediction System.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="auth-body">

  <div class="auth-card">
    <!-- Logo -->
    <div class="auth-logo">
      <i class="bi bi-graph-up-arrow" style="color:#fff;font-size:1.5rem;"></i>
    </div>

    <h1 class="auth-title">Welcome Back</h1>
    <p class="auth-subtitle">Sign in to your analytics dashboard</p>

    <!-- Flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for cat, msg in messages %}
          <div class="alert alert-{{ cat }} alert-dismissible fade show mb-3" role="alert">
            <i class="bi bi-{{ 'check-circle' if cat=='success' else 'exclamation-circle' }}-fill me-2"></i>{{ msg }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}" id="loginForm">
      <div class="form-floating mb-3">
        <input type="email" class="form-control" id="loginEmail" name="email"
               placeholder="name@example.com" required autocomplete="email">
        <label for="loginEmail"><i class="bi bi-envelope me-1"></i>Email Address</label>
      </div>

      <div class="form-floating mb-4 position-relative">
        <input type="password" class="form-control" id="loginPassword" name="password"
               placeholder="Password" required autocomplete="current-password">
        <label for="loginPassword"><i class="bi bi-lock me-1"></i>Password</label>
        <button type="button" class="btn position-absolute end-0 top-50 translate-middle-y pe-3"
                style="background:none;border:none;z-index:5;"
                onclick="togglePwd('loginPassword', this)">
          <i class="bi bi-eye" style="color:#94a3b8;"></i>
        </button>
      </div>

      <button type="submit" class="btn-auth btn mb-4" id="loginSubmit">
        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
      </button>
    </form>

    <div class="text-center">
      <p class="text-muted" style="font-size:.88rem;">
        Don't have an account?
        <a href="{{ url_for('register') }}" style="color:var(--primary);font-weight:600;text-decoration:none;">
          Create Account
        </a>
      </p>
      <a href="{{ url_for('index') }}" style="color:#94a3b8;font-size:.82rem;text-decoration:none;">
        <i class="bi bi-arrow-left me-1"></i>Back to Home
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script>
    function togglePwd(id, btn) {
      const inp = document.getElementById(id);
      const ico = btn.querySelector('i');
      if (inp.type === 'password') {
        inp.type = 'text';
        ico.className = 'bi bi-eye-slash';
      } else {
        inp.type = 'password';
        ico.className = 'bi bi-eye';
      }
    }
  </script>
</body>
</html>
