<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — AI Budget Prediction System</title>
  <meta name="description" content="Create your account for the AI-Based Financial Budget Deviation Prediction System.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="auth-body">

  <div class="auth-card" style="max-width:500px;">
    <div class="auth-logo">
      <i class="bi bi-person-plus" style="color:#fff;font-size:1.5rem;"></i>
    </div>

    <h1 class="auth-title">Create Account</h1>
    <p class="auth-subtitle">Join the AI Budget Analytics Platform</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for cat, msg in messages %}
          <div class="alert alert-{{ cat }} alert-dismissible fade show mb-3" role="alert">
            <i class="bi bi-{{ 'check-circle' if cat=='success' else 'exclamation-circle' }}-fill me-2"></i>{{ msg }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('register') }}" id="registerForm">
      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="regFullname" name="fullname"
               placeholder="Full Name" required autocomplete="name"
               value="{{ request.form.fullname if request.form.fullname else '' }}">
        <label for="regFullname"><i class="bi bi-person me-1"></i>Full Name</label>
      </div>

      <div class="form-floating mb-3">
        <input type="email" class="form-control" id="regEmail" name="email"
               placeholder="Email" required autocomplete="email"
               value="{{ request.form.email if request.form.email else '' }}">
        <label for="regEmail"><i class="bi bi-envelope me-1"></i>Email Address</label>
      </div>

      <div class="form-floating mb-3 position-relative">
        <input type="password" class="form-control" id="regPassword" name="password"
               placeholder="Password" required minlength="6"
               oninput="checkStrength(this.value)">
        <label for="regPassword"><i class="bi bi-lock me-1"></i>Password</label>
        <button type="button" class="btn position-absolute end-0 top-50 translate-middle-y pe-3"
                style="background:none;border:none;z-index:5;"
                onclick="togglePwd('regPassword', this)">
          <i class="bi bi-eye" style="color:#94a3b8;"></i>
        </button>
      </div>

      <!-- Password strength bar -->
      <div class="mb-3">
        <div class="progress" style="height:4px;border-radius:2px;">
          <div id="pwdStrengthBar" class="progress-bar" style="width:0%;transition:all .3s;"></div>
        </div>
        <small id="pwdStrengthLabel" class="text-muted" style="font-size:.75rem;"></small>
      </div>

      <div class="form-floating mb-4 position-relative">
        <input type="password" class="form-control" id="regConfirm" name="confirm_password"
               placeholder="Confirm Password" required>
        <label for="regConfirm"><i class="bi bi-shield-lock me-1"></i>Confirm Password</label>
        <button type="button" class="btn position-absolute end-0 top-50 translate-middle-y pe-3"
                style="background:none;border:none;z-index:5;"
                onclick="togglePwd('regConfirm', this)">
          <i class="bi bi-eye" style="color:#94a3b8;"></i>
        </button>
      </div>

      <button type="submit" class="btn-auth btn mb-4" id="regSubmit">
        <i class="bi bi-person-check me-2"></i>Create Account
      </button>
    </form>

    <div class="text-center">
      <p class="text-muted" style="font-size:.88rem;">
        Already have an account?
        <a href="{{ url_for('login') }}" style="color:var(--primary);font-weight:600;text-decoration:none;">
          Sign In
        </a>
      </p>
      <a href="{{ url_for('index') }}" style="color:#94a3b8;font-size:.82rem;text-decoration:none;">
        <i class="bi bi-arrow-left me-1"></i>Back to Home
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script>
    function togglePwd(id, btn) {
      const inp = document.getElementById(id);
      const ico = btn.querySelector('i');
      inp.type = inp.type === 'password' ? 'text' : 'password';
      ico.className = inp.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
    }

    function checkStrength(val) {
      const bar   = document.getElementById('pwdStrengthBar');
      const label = document.getElementById('pwdStrengthLabel');
      let score = 0;
      if (val.length >= 6) score++;
      if (val.length >= 10) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;
      const levels = [
        { pct: 20,  color: '#ef476f', text: 'Very Weak' },
        { pct: 40,  color: '#f59e0b', text: 'Weak' },
        { pct: 60,  color: '#ffd166', text: 'Fair' },
        { pct: 80,  color: '#06d6a0', text: 'Strong' },
        { pct: 100, color: '#059669', text: 'Very Strong' },
      ];
      const lvl = levels[Math.min(score - 1, 4)] || { pct: 0, color: '', text: '' };
      bar.style.width = lvl.pct + '%';
      bar.style.background = lvl.color;
      label.textContent = lvl.text;
      label.style.color = lvl.color;
    }

    document.getElementById('registerForm').addEventListener('submit', function(e) {
      const p1 = document.getElementById('regPassword').value;
      const p2 = document.getElementById('regConfirm').value;
      if (p1 !== p2) {
        e.preventDefault();
        alert('Passwords do not match!');
      }
    });
  </script>
</body>
</html>
